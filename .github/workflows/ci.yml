name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Regenerate the lockfile when it is absent or out of sync with
        # package.json (a lockfile created on one OS lacks the optional
        # platform binaries other OSes need), then install strictly.
        run: |
          if [ ! -f package-lock.json ] || ! npm ci --dry-run >/dev/null 2>&1; then
            echo "Lockfile missing or stale -> regenerating"
            npm install --package-lock-only
          fi
          npm ci

      - name: Type-check + build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
